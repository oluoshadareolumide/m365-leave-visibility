<?xml version="1.0" encoding="UTF-8"?>
<!--
  Original wordmark created for this project, inspired by the clean, premium
  styling of the Hakim Group brand (an eyecare / optical group — hence the lens
  motif). It is NOT the official Hakim Group logo. Replace assets/logo.svg with
  the licensed brand asset before any production / customer-facing use.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="280" height="56" viewBox="0 0 280 56" role="img" aria-label="Hakim Group">
  <!-- Lens / eye mark -->
  <g transform="translate(4 4)">
    <circle cx="24" cy="24" r="23" fill="none" stroke="#10203a" stroke-width="2"/>
    <path d="M5 24c5-9 13-13.5 19-13.5S38 15 43 24c-5 9-13 13.5-19 13.5S10 33 5 24Z"
          fill="none" stroke="#10203a" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="24" cy="24" r="7.5" fill="#0b6b66"/>
    <circle cx="21" cy="21" r="2.4" fill="#ffffff"/>
  </g>
  <!-- Wordmark -->
  <text x="64" y="27" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700"
        letter-spacing="0.5" fill="#10203a">HAKIM</text>
  <text x="148" y="27" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="300"
        letter-spacing="0.5" fill="#10203a">GROUP</text>
  <rect x="64" y="35" width="168" height="2" fill="#0b6b66"/>
  <text x="64" y="49" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600"
        letter-spacing="3" fill="#5b6470">IT SUPPORT PORTAL</text>
</svg>
