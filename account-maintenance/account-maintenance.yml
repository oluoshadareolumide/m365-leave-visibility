# Account-wide maintenance scheduler.
#
# DEPLOY: copy this file to  .github/workflows/account-maintenance.yml
#         on the DEFAULT branch of your chosen host repo, then add the
#         GH_MAINTENANCE_TOKEN secret (see account-maintenance/README.md).
#
# Scheduled workflows only run from the repository's DEFAULT branch.
name: account-maintenance

on:
  schedule:
    # Daily at 06:17 UTC — keeps the threat-intel feeds fresh (they change most
    # days, so this is where the steady activity comes from). Heavier tasks like
    # deps simply no-op on days with nothing to do. cron uses UTC; tune freely.
    - cron: "17 6 * * *"
  workflow_dispatch:
    # Manual "Run workflow" button — use this with dry-run first.
    inputs:
      dry_run:
        description: "Dry run (no commits/pushes)"
        type: boolean
        default: true

permissions:
  contents: read   # the PAT, not GITHUB_TOKEN, does the cross-repo work

concurrency:
  group: account-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install optional maintenance tools
        run: |
          python -m pip install --upgrade black pur

      - name: Run maintenance
        env:
          GH_MAINTENANCE_TOKEN: ${{ secrets.GH_MAINTENANCE_TOKEN }}
        run: |
          python account-maintenance/maintain.py \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
